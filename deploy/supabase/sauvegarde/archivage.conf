# Archivage continu (Shede) : chaque segment WAL terminé est copié par copier-wal.sh,
# puis envoyé vers B2 par le conteneur shede-sauvegarde.
archive_mode = on
archive_command = '/usr/local/bin/copier-wal.sh %p %f'
# Au moins un segment par minute, même s'il y a peu d'activité : perte maximale ~1 min
archive_timeout = 60
# Copie de secours vers Supabase (réplication logique) : si elle décroche, le disque
# du serveur ne garde pas plus de 10 Go de modifications en attente.
max_slot_wal_keep_size = 10GB
