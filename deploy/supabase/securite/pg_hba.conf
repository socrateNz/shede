# Accès à la base de Shede (conteneur supabase-db). Remplace /etc/postgresql/pg_hba.conf
# (réglage hba_file dans securite.conf). Lu de haut en bas : la première règle qui correspond s'applique.

# Dans le conteneur : comme le fichier d'origine de Supabase
local all  supabase_admin     trust
local all  all                peer map=supabase_map
host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust

# Conteneurs Supabase (réseau Docker, IPv4 et IPv6 interne) et accès local du serveur (127.0.0.1:54322)
host  all  all  10.0.0.0/8          scram-sha-256
host  all  all  172.16.0.0/12       scram-sha-256
host  all  all  192.168.0.0/16      scram-sha-256
host  all  all  fd5e:de00:5ede::/64 scram-sha-256

# Internet (port 5433, IPv6 uniquement) : uniquement la copie de secours vers Supabase cloud,
# chiffrée, depuis Amazon Francfort (adresses IPv6 de Supabase cloud, eu-central-1)
hostssl postgres replication_secours 2a05:d014::/32 scram-sha-256

# Tout autre accès depuis Internet est refusé
host all all 0.0.0.0/0 reject
host all all ::/0      reject
