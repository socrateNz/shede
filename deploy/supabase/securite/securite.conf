# Copie de secours (réplication logique vers Supabase cloud) : règles d'accès propres à Shede
# et connexions chiffrées. Fichiers montés depuis ~/apps/shede-supabase/securite/.
hba_file = '/etc/postgresql-custom/shede/pg_hba.conf'
ssl = on
ssl_cert_file = '/etc/postgresql-custom/shede/server.crt'
ssl_key_file = '/etc/postgresql-custom/shede/server.key'
ssl_min_protocol_version = 'TLSv1.2'
